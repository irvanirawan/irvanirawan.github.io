            return urlParams.get(param);

        document.getElementById('profile-image').innerHTML = `<img src="${personalInfo.profileImage}" alt="${personalInfo.name}" class="w-full h-full rounded-full object-cover">`;

        document.getElementById('profile-title').textContent = personalInfo.title;
        document.getElementById('profile-contact').innerHTML = `📱 ${personalInfo.phone} | ✉️ ${personalInfo.email}`;
        document.getElementById('profile-address').innerHTML = `🏠 ${personalInfo.address}`;
        if(getQueryParam('salary') === 'true') {
            document.getElementById('profile-salary').innerHTML = `💼 Expected Salary: ${personalInfo.expectedSalary}`;

        // Populate experience summary

                                        ${exp.projects.map(project => `
                                            <span class="bg-teal-50 text-teal-700 px-3 py-1 rounded-md text-sm flex items-center group hover:bg-teal-100 transition-colors duration-200">

                                                </svg>

                                    </div>
                                </div>
                            ` : ''}
                            
                            ${exp.responsibilities.length > 0 ? `
                                <!-- Responsibilities -->
                                <div>
                                    <h4 class="font-semibold text-gray-700 mb-3 flex items-center">
                                        <svg class="w-5 h-5 text-blue-500 mr-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                            <path fill-rule="evenodd" d="M6 6V5a3 3 0 013-3h2a3 3 0 013 3v1h2a2 2 0 012 2v3.57A22.952 22.952 0 0110 13a22.95 22.95 0 01-8-1.43V8a2 2 0 012-2h2zm2-1a1 1 0 011-1h2a1 1 0 011 1v1H8V5zm1 5a1 1 0 011-1h.01a1 1 0 110 2H10a1 1 0 01-1-1z" clip-rule="evenodd"></path>

                    <div class="flex items-center">
                        <div class="w-full bg-gray-200 rounded-full h-2.5">

                        <div class="ml-3 text-gray-500 text-sm">${lang.proficiencyText}</div>

        document.getElementById('about-nationality').textContent = personalInfo.nationality;
        
        // Populate footer
        const currentYear = new Date().getFullYear();
        document.getElementById('footer-copyright').textContent = `© ${currentYear} ${personalInfo.name}. All rights reserved.`;
        
        // Back to top button functionality
        const backToTopButton = document.getElementById('back-to-top');
        
        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                backToTopButton.classList.remove('opacity-0');
                backToTopButton.classList.add('opacity-100');
            } else {
                backToTopButton.classList.remove('opacity-100');
                backToTopButton.classList.add('opacity-0');
            }
        });
        
        backToTopButton.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
